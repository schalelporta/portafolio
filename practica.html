<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pr&aacute;ctica con hover</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6b21a8',
                        primaryLight: '#9333ea',
                        darkBg: '#0f0f11',
                        darkCard: '#15151a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f0f11] text-gray-200 font-sans antialiased min-h-screen relative overflow-x-hidden">

    <main class="relative z-10 min-h-screen px-6 py-12">
        <div class="mx-auto flex w-full max-w-6xl flex-col gap-8">

            <div class="flex justify-end">
                <a href="Video practica.html" class="inline-flex items-center bg-darkCard border border-gray-800 hover:border-primaryLight text-gray-300 hover:text-white font-medium py-3 px-6 rounded-lg shadow-lg transition-all duration-300 group">
                    <i class="fas fa-play mr-3 text-primaryLight transition-transform duration-300 group-hover:translate-x-1"></i> Ir a Video pr&aacute;ctica
                </a>
            </div>

            <div class="grid w-full gap-8 md:grid-cols-2 2xl:grid-cols-3">

                <div class="group relative flex min-h-[320px] items-center justify-center overflow-hidden rounded-[2rem] border border-gray-800 bg-[#111116] p-6 shadow-[0_20px_45px_rgba(0,0,0,0.35)] transition-all duration-300 hover:-translate-y-2 hover:border-cyan-200/40 hover:shadow-[0_24px_55px_rgba(34,211,238,0.26)]">
                    <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/35 via-sky-500/20 to-blue-600/30 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
                    <img src="img/CR7 PLANET.jfif" alt="Cristiano Ronaldo" class="relative z-10 h-[200px] w-[200px] rounded-full border-4 border-white/20 object-cover shadow-[0_0_35px_rgba(34,211,238,0.28)] transition-transform duration-300 group-hover:scale-105">
                </div>

                <div class="group relative flex min-h-[420px] items-center justify-center overflow-hidden rounded-[2rem] border border-gray-800 bg-[#111116] p-6 shadow-[0_20px_45px_rgba(0,0,0,0.35)] transition-all duration-300 hover:-translate-y-2 hover:border-emerald-200/40 hover:shadow-[0_24px_55px_rgba(16,185,129,0.26)]">
                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/35 via-teal-500/20 to-green-600/30 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
                    <img src="img/CR7 PLANET.jfif" alt="Cristiano Ronaldo" class="relative z-10 h-[200px] w-[200px] rounded-full border-4 border-white/20 object-cover shadow-[0_0_35px_rgba(16,185,129,0.28)] transition-transform duration-300 group-hover:scale-105">
                </div>

                <div class="group relative flex min-h-[520px] items-center justify-center overflow-hidden rounded-[2rem] border border-gray-800 bg-[#111116] p-6 shadow-[0_20px_45px_rgba(0,0,0,0.35)] transition-all duration-300 hover:-translate-y-2 hover:border-fuchsia-200/40 hover:shadow-[0_24px_55px_rgba(217,70,239,0.26)] md:col-span-2 2xl:col-span-1">
                    <div class="absolute inset-0 bg-gradient-to-br from-fuchsia-500/35 via-violet-500/20 to-purple-600/30 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
                    <img src="img/CR7 PLANET.jfif" alt="Cristiano Ronaldo" class="relative z-10 h-[200px] w-[200px] rounded-full border-4 border-white/20 object-cover shadow-[0_0_35px_rgba(217,70,239,0.28)] transition-transform duration-300 group-hover:scale-105">
                </div>

            </div>
        </div>
    </main>

</body>
</html>
